<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokedex-Z</title>
  <link rel="icon" type="image/png" href="img/Icono_Web.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="dark">
  <header class="site-header">
    <div class="header-inner">
      <img src="img/Icono_Web.png" alt="Icono Pokedex-Z" class="header-icon">
      <h1>Pokedex-Z</h1>
      <div class="controles">
        <label for="buscar">Buscar</label>
        <input id="buscar" type="text" placeholder="Filtrar por nombre...">
        <button id="modo-oscuro" aria-label="Cambiar modo oscuro">☀️ Modo claro</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Selector de carga -->
    <div class="selector-gen">
      <span class="selector-gen-label">Generaciones:</span>
      <div class="gen-checks">
        <label class="gen-opcion"><input type="checkbox" id="chk-gen1" checked><span>Gen I <em>#001–#151</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen2"><span>Gen II <em>#152–#251</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen3"><span>Gen III <em>#252–#386</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen4"><span>Gen IV <em>#387–#493</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen5"><span>Gen V <em>#494–#649</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen6"><span>Gen VI <em>#650–#721</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen7"><span>Gen VII <em>#722–#809</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen8"><span>Gen VIII <em>#810–#905</em></span></label>
        <label class="gen-opcion"><input type="checkbox" id="chk-gen9"><span>Gen IX <em>#906–#1025</em></span></label>
      </div>
      <div class="gen-acciones-rapidas">
        <button id="sel-todo" type="button">Seleccionar todo</button>
        <button id="desel-todo" type="button">Desmarcar todo</button>
      </div>
      <button id="cargar">Cargar Pokémon</button>
    </div>

    <!-- Panel de filtro multi-selección (visible tras cargar) -->
    <div id="filtros-gen" hidden>
      <div class="filtro-panel">
        <span class="selector-gen-label">Filtrar por:</span>
        <div id="filtro-checks" class="gen-checks"></div>
        <div class="gen-acciones-rapidas">
          <button id="filtro-sel-todo" type="button">Seleccionar todo</button>
          <button id="filtro-desel-todo" type="button">Desmarcar todo</button>
        </div>
      </div>
    </div>

    <!-- Favoritos -->
    <section id="seccion-favoritos" hidden>
      <h2>Favoritos</h2>
      <div id="favoritos-grid"></div>
    </section>

    <p id="contador"></p>

    <!-- Galería: cada generación vive en su propio contenedor -->
    <div id="galeria" aria-label="Galería de pokémon">
      <p class="mensaje-inicio">Selecciona una o más generaciones y haz clic en "Cargar Pokémon".</p>
    </div>
  </main>

  <footer>
    <p>Hecho por Walther Mora · Datos de <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

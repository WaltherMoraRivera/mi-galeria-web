<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería Pokémon</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Galería Pokémon</h1>
      <div class="controles">
        <label for="buscar">Buscar</label>
        <input id="buscar" type="text" placeholder="Filtrar por nombre...">
        <button id="modo-oscuro" aria-label="Cambiar modo oscuro">🌙 Modo oscuro</button>
      </div>
    </div>
  </header>

  <main>
    <div class="acciones">
      <button id="cargar">Cargar Pokémon</button>
    </div>
    <section id="seccion-favoritos" hidden>
      <h2>Favoritos</h2>
      <div id="favoritos-grid"></div>
    </section>

    <p id="contador"></p>
    <section id="galeria" aria-label="Galería de pokémon">
      <p class="mensaje-inicio">Haz clic en "Cargar Pokémon" para comenzar.</p>
    </section>
  </main>

  <footer>
    <p>Hecho por Walther Mora · Datos de <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

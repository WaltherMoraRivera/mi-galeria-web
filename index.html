<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería Pokémon</title>
  <link rel="icon" type="image/png" href="img/Icono_Web.png">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="dark">
  <header class="site-header">
    <div class="header-inner">
      <img src="img/Icono_Web.png" alt="Icono Galería Pokémon" class="header-icon">
      <h1>Galería Pokémon</h1>
      <div class="controles">
        <label for="buscar">Buscar</label>
        <input id="buscar" type="text" placeholder="Filtrar por nombre...">
        <button id="modo-oscuro" aria-label="Cambiar modo oscuro">☀️ Modo claro</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Selector de generaciones -->
    <div class="selector-gen">
      <span class="selector-gen-label">Generaciones:</span>
      <label class="gen-opcion">
        <input type="checkbox" id="chk-gen1" checked>
        <span>Gen I <em>(#001–#151)</em></span>
      </label>
      <label class="gen-opcion">
        <input type="checkbox" id="chk-gen2">
        <span>Gen II <em>(#152–#251)</em></span>
      </label>
      <button id="cargar">Cargar Pokémon</button>
    </div>

    <!-- Filtros por generación (visibles tras cargar) -->
    <div id="filtros-gen" hidden>
      <button class="filtro-btn activo" data-gen="todas">Todas</button>
      <button class="filtro-btn" data-gen="1">Gen I</button>
      <button class="filtro-btn" data-gen="2">Gen II</button>
    </div>

    <!-- Favoritos -->
    <section id="seccion-favoritos" hidden>
      <h2>Favoritos</h2>
      <div id="favoritos-grid"></div>
    </section>

    <p id="contador"></p>

    <!-- Galería dividida por sección -->
    <div id="galeria" aria-label="Galería de pokémon">
      <p class="mensaje-inicio">Selecciona una o más generaciones y haz clic en "Cargar Pokémon".</p>
    </div>
  </main>

  <footer>
    <p>Hecho por Walther Mora · Datos de <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
